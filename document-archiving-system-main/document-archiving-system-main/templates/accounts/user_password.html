{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="page-head"><div><div class="eyebrow">Administrator</div>
<h1>Reset password for {{ target_user.username }}</h1></div></div>
<div class="card" style="max-width:520px">
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "form_field.html" %}{% endfor %}
    <div class="btn-row"><button class="btn" type="submit"><svg class="icon"><use href="#icon-lock"/></svg>Set new password</button>
      <a class="btn btn--quiet" href="{% url 'accounts:user_list' %}"><svg class="icon"><use href="#icon-x"/></svg>Cancel</a></div>
  </form>
</div>
{% endblock %}
