{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><div class="eyebrow">Your account</div><h1>Change password</h1></div></div>
<div class="card" style="max-width:520px">
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "form_field.html" %}{% endfor %}
    <div class="btn-row"><button class="btn" type="submit"><svg class="icon"><use href="#icon-lock"/></svg>Change password</button>
      <a class="btn btn--quiet" href="{% url 'documents:dashboard' %}"><svg class="icon"><use href="#icon-x"/></svg>Cancel</a></div>
  </form>
</div>
{% endblock %}
